name: log-service

services:
  database:
    image: postgres:18-alpine
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=16MB
      - -c
      - wal_buffers=64MB
      - -c
      - gin_pending_list_limit=32MB
      - -c
      - max_wal_size=16GB
      - -c
      - min_wal_size=1GB
      - -c
      - checkpoint_timeout=60min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
      - -c
      - random_page_cost=1.1
      - -c
      - jit=off
      - -c
      - synchronous_commit=on
      - -c
      - fsync=on
      - -c
      - full_page_writes=on
      - -c
      - max_connections=30
      - -c
      - autovacuum_naptime=15s
      - -c
      - autovacuum_vacuum_scale_factor=0.05
      - -c
      - autovacuum_analyze_scale_factor=0.02
      - -c
      - autovacuum_vacuum_cost_limit=2000
      - -c
      - autovacuum_vacuum_cost_delay=2ms
    environment:
      POSTGRES_DB: log_service
      POSTGRES_USER: log_service
      POSTGRES_PASSWORD: log_service
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U log_service -d log_service']
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s
    volumes:
      # postgres:18 images changed the data-dir layout; the volume must mount at
      # /var/lib/postgresql (not .../data) or the container refuses to start.
      - postgres-data:/var/lib/postgresql
    ports:
      - '127.0.0.1:${DB_PORT:-15432}:5432'
    shm_size: 128mb
    cpus: 1.0
    mem_limit: 1g
    stop_grace_period: 30s
    restart: unless-stopped

  application:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://log_service:log_service@database:5432/log_service
      DB_POOL_MAX: 4
      DB_IDLE_TIMEOUT_MS: 30000
      DB_CONNECTION_TIMEOUT_MS: 5000
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      RETENTION_INTERVAL_MS: ${RETENTION_INTERVAL_MS:-60000}
      RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE:-5000}
      RETENTION_MAX_BATCHES_PER_RUN: ${RETENTION_MAX_BATCHES_PER_RUN:-10}
    depends_on:
      database:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - '${APP_PORT:-8080}:8080'
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cpus: 0.5
    mem_limit: 256m
    stop_grace_period: 35s
    restart: unless-stopped

volumes:
  postgres-data:
