name: log-service

services:
  database:
    image: postgres:17.7-bookworm
    environment:
      POSTGRES_DB: log_service
      POSTGRES_USER: log_service
      POSTGRES_PASSWORD: log_service
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U log_service -d log_service']
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    shm_size: 128mb
    cpus: 1.0
    mem_limit: 1g
    restart: unless-stopped

  application:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      LOG_LEVEL: info
      DATABASE_URL: postgresql://log_service:log_service@database:5432/log_service
      DB_POOL_MAX: 20
      DB_IDLE_TIMEOUT_MS: 30000
      DB_CONNECTION_TIMEOUT_MS: 5000
    depends_on:
      database:
        condition: service_healthy
        restart: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    ports:
      - '${APP_PORT:-8080}:8080'
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cpus: 0.5
    mem_limit: 256m
    restart: unless-stopped

volumes:
  postgres-data:
